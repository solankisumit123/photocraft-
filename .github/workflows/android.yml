name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release or debug)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Android SDK Platform 30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install build tools
        run: |
          cargo install cargo-ndk --locked || cargo install cargo-ndk
          cargo install cargo-apk --locked || cargo install cargo-apk || true

      - name: Build Android APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          bash packaging/android/package.sh

      - name: Verify APK
        run: |
          ls -lh dist/release/*.apk
          unzip -l dist/release/*.apk | head -n 30

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apk
          path: dist/release/*.apk
          if-no-files-found: error
