[package]
name = "photocraft-android"
description = "PhotoCraft on Android (native eframe on wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open HEIC/HEIF photos (the optional photocraft-heif crate).
heif = ["photocraft-codecs/heif"]

# Follows the isolated unsafe pattern from photocraft-tablet for the JNI/C entry point.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-ui-egui = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-format = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-geom = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
android_logger = "0.14"
winit = { version = "=0.30.13", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_label = "PhotoCraft"
target_sdk_version = 30
min_sdk_version = 26
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
